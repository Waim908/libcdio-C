name: Static libraries, clang

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Commit hash or ref to build
        required: false
        default: ee2f9e380e346d7a9c46ad71105353940101992a

permissions:
  contents: read

jobs:
  build-static:
    name: ${{ matrix.arch }} static .a
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            expected: x86-64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            expected: ARM aarch64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.commit || github.sha }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool pkg-config \
            clang llvm lld

      - name: Build static libraries
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          export CFLAGS="-O2 -pipe -fno-ident -ffunction-sections -fdata-sections"
          export CXXFLAGS="$CFLAGS"

          export CC=clang
          export CXX=clang++
          export LDFLAGS="-s -fuse-ld=lld"

          export AR=llvm-ar
          export RANLIB=llvm-ranlib
          export NM=llvm-nm
          export STRIP=llvm-strip

          autoreconf -f -i

          build_dir="$PWD/build/$ARCH"
          mkdir -p "$build_dir"
          cd "$build_dir"

          "$GITHUB_WORKSPACE/configure" \
            --prefix=/usr \
            --enable-static \
            --disable-shared \
            --without-versioned-libs \
            --disable-cxx \
            --disable-example-progs \
            --disable-cddb \
            --without-cdda-player \
            --without-cd-drive \
            --without-cd-info \
            --without-cd-read \
            --without-iso-info \
            --without-iso-read

          make -C include -j"$(nproc)"
          make -C lib -j"$(nproc)"

          stage="$PWD/stage"
          make -C include install DESTDIR="$stage"
          make -C lib install DESTDIR="$stage"
          make install-pkgconfigDATA DESTDIR="$stage"

          find "$stage" -name '*.a' -print

      - name: Strip static archives
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          stage="$PWD/build/$ARCH/stage"
          while IFS= read -r -d '' archive; do
            echo "Stripping $archive"
            llvm-strip --strip-unneeded "$archive"
            llvm-ranlib "$archive"
          done < <(find "$stage" -name '*.a' -print0)

      - name: Show configure log
        if: failure()
        run: |
          find build -name config.log -print -exec sed -n '1,260p' {} \; 2>/dev/null || true

      - name: Verify static archives
        env:
          EXPECTED: ${{ matrix.expected }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          stage="$PWD/build/$ARCH/stage"

          shared="$(find "$stage" \( -name '*.so' -o -name '*.so.*' \) -print)"
          if [ -n "$shared" ]; then
            echo "Shared libraries were produced despite --disable-shared:"
            echo "$shared"
            exit 1
          fi

          mapfile -t archives < <(find "$stage/usr" -name '*.a' -print | sort)
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "No static archives were produced"
            exit 1
          fi

          for archive in "${archives[@]}"; do
            member="$(llvm-ar t "$archive" | head -n 1)"
            llvm-ar p "$archive" "$member" > /tmp/check.o
            file_output="$(file -b /tmp/check.o)"
            echo "$archive: $file_output"
            if ! grep -Fq "$EXPECTED" <<< "$file_output"; then
              echo "Expected architecture '$EXPECTED' in $archive"
              exit 1
            fi
          done

      - name: Package artifacts
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          stage="$PWD/build/$ARCH/stage"
          (
            cd "$stage"
            find usr -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )

          name="libcdio-static-clang-$ARCH"
          tar -C "$stage" -czf "$name.tar.gz" usr SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libcdio-static-clang-${{ matrix.arch }}
          path: libcdio-static-clang-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
